{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 800px; padding-top: 2rem;">
    <div class="card" style="height: 80vh; display: flex; flex-direction: column;">
        <div class="card-header">
            <span>🤖 Risk Assessment Assistant</span>
            <span class="badge bg-success" style="margin-left: auto;">Online</span>
        </div>

        <div id="chat-history" class="card-body"
            style="flex: 1; overflow-y: auto; background-color: #f8fafc; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Messages will appear here -->
        </div>

        <div class="card-footer"
            style="padding: 1rem; border-top: 1px solid var(--border-color); background-color: white;">
            <div id="options-container" style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
                <!-- Quick reply buttons will appear here -->
            </div>

            <form id="chat-form" style="display: flex; gap: 0.5rem;">
                <input type="text" id="user-input" class="form-control" placeholder="Type your answer..."
                    autocomplete="off">
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
    </div>
</div>

<style>
    .message {
        max-width: 80%;
        padding: 1rem;
        border-radius: 1rem;
        line-height: 1.5;
        position: relative;
        animation: fadeIn 0.3s ease-out;
    }

    .message.bot {
        align-self: flex-start;
        background-color: white;
        border: 1px solid var(--border-color);
        border-bottom-left-radius: 0.25rem;
        color: var(--text-color);
    }

    .message.user {
        align-self: flex-end;
        background-color: var(--primary-color);
        color: white;
        border-bottom-right-radius: 0.25rem;
    }

    .typing-indicator {
        display: inline-flex;
        gap: 4px;
        padding: 1rem;
        background: white;
        border-radius: 1rem;
        border-bottom-left-radius: 0.25rem;
        border: 1px solid var(--border-color);
        align-self: flex-start;
        margin-bottom: 1rem;
    }

    .typing-dot {
        width: 8px;
        height: 8px;
        background: var(--text-light);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
        }

        40% {
            transform: scale(1);
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const chatHistory = document.getElementById('chat-history');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const optionsContainer = document.getElementById('options-container');

        // Initial Load
        loadChat();

        chatForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (text) {
                sendMessage(text);
                userInput.value = '';
            }
        });

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            scrollToBottom();
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typing-indicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatHistory.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function renderOptions(options) {
            optionsContainer.innerHTML = '';
            if (options && options.length > 0) {
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-sm btn-secondary';
                    btn.textContent = opt;
                    btn.onclick = () => {
                        sendMessage(opt);
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function loadChat() {
            fetch('/assessment/chat/history')
                .then(response => response.json())
                .then(data => {
                    chatHistory.innerHTML = ''; // Clear existing
                    data.history.forEach(msg => {
                        appendMessage(msg.sender, msg.text);
                    });

                    // If history is empty, trigger start
                    if (data.history.length === 0) {
                        sendMessage('START_SESSION', true);
                    } else {
                        // Restore options if last message was bot
                        const lastMsg = data.history[data.history.length - 1];
                        if (lastMsg.sender === 'bot' && lastMsg.options) {
                            renderOptions(lastMsg.options);
                        }
                    }
                });
        }

        function sendMessage(text, hidden = false) {
            if (!hidden) {
                appendMessage('user', text);
            }
            optionsContainer.innerHTML = ''; // Clear options
            showTyping();

            fetch('/assessment/chat/message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token() }}'
                },
                body: JSON.stringify({ message: text })
            })
                .then(response => response.json())
                .then(data => {
                    hideTyping();
                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }
                    appendMessage('bot', data.text);
                    renderOptions(data.options);
                })
                .catch(err => {
                    hideTyping();
                    console.error(err);
                });
        }
    });
</script>
{% endblock %}
