{% extends 'base.html' %}

{% block content %}
<div class="login-container"
    style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background-color: #fff;">
    <h2 style="text-align: center; margin-bottom: 20px;">Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
        </div>

        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" class="form-control" required>
                <option value="Analyst">Analyst (Full Access)</option>
                <option value="Viewer">Viewer (Read Only)</option>
                <option value="Admin">Admin (Manage Assessments)</option>
            </select>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
    </form>
</div>
{% endblock %}
